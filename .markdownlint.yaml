# markdownlint configuration for scriptorium.
# Most defaults; loosened for academic-style prose.
---
default: true

# Disable line-length checking. Cross-link lists and dense
# academic-style citations regularly run past any reasonable limit;
# soft-wrap is left to the editor, not the linter.
MD013: false

# Allow inline HTML where useful (e.g., <kbd>, <details>).
MD033: false

# Don't require a heading at the top of every file.
MD041: false

# Allow ordered lists numbered like "1." not "1. 2. 3."
MD029:
  style: ordered

# Permit code blocks without language hints in some contexts.
MD040: false

# Disable table-column-style — compact tables (no spaces around pipes)
# are valid Markdown and easier to read in many contexts; enforcing
# whitespace style is cosmetic noise.
MD060: false

# Keep-a-Changelog repeats "### Added" / "### Changed" / "### Fixed"
# under every release. Allow the duplication as long as the parent
# heading (the release version) differs.
MD024:
  siblings_only: true
