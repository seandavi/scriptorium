# MANUSCRIPT_STATE.yaml
#
# Shared editorial state for a scriptorium-managed writing project.
# Every scriptorium skill reads this file to ground its work.
# Validate at any time with: scriptorium validate MANUSCRIPT_STATE.yaml
#
# Only `project` and `document_phase` are required. Fill in the rest as
# the manuscript matures.

# Scriptorium-side preferences (how scriptorium talks to you).
# Not editorial properties of the manuscript itself. Optional; defaults
# to standard. scriptorium:init asks you to pick once on first run.
# meta:
#   guidance_level: standard  # one of: terse, standard, full
#     # terse    — questions and confirmations only, no prose between turns
#     # standard — brief one-line "why" before non-obvious questions
#     # full     — upfront orientation, 2-3 sentence rationale per field,
#     #            end-of-phase recaps; the complete experience, designed
#     #            so an author learns the workflow as they fill the YAML.
#     #            Best on a first scriptorium project.
#   overrides:                # guards you choose to override for this project
#     - guard: nih-application-prose  # a guard id from a skill's manifest.yaml
#       skills: [specific-aims]       # or ["*"] for every skill that declares it
#       note: "Institution's grants office reviewed our AI use"  # optional
#     # Policy and scope guards only; accuracy guards cannot be
#     # overridden. Skills still state the concern in one line and
#     # list the guard under "Overrides applied" in their output.
#     # See knowledge/conventions/author-authority.md.

project:
  title: "Working title goes here"
  target_type: manuscript   # one of: manuscript, grant, review, preprint, book-chapter, thesis, white-paper, other
  target_venue: ""          # primary venue once you have one (journal / funder / conference); leave empty if undecided
  # candidate_venues: []    # list of venues you're considering; set by /scriptorium:venue-fit or by hand
  # source_format: markdown # optional hint: quarto | latex | markdown | docx-via-pandoc | gdocs-export | other

document_phase:
  current: outline          # one of: outline, draft, review, revision, submission, post-submission, accepted
  # submission_target_date: 2026-12-31

# What the document is arguing. Critique skills test whether the prose
# actually supports each claim; transformation skills must preserve them.
core_claims: []

# Limitations the authors have already acknowledged. Reviewer-simulation
# will not flag these as fatal because they're known.
known_weaknesses: []

terminology:
  preferred: []
  forbidden: []
  synonyms: {}

style:
  tone: []                  # e.g. ["quantitative", "restrained", "evidence-driven"]
  # voice: active           # one of: active, passive, mixed
  # audience: ""

constraints:
  preserve_citations: true
  preserve_statistics: true
  avoid_hype: true
  # max_word_count: 4000

bibliography:
  paths: []                 # paths to .bib / .json / .yaml bibliographies
  # format: bibtex          # one of: bibtex, csl-json, yaml, mixed

# Optional explicit section manifest for multi-file projects.
sections: []
