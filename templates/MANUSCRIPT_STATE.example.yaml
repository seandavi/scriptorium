# MANUSCRIPT_STATE.example.yaml
#
# A fully-populated MANUSCRIPT_STATE.yaml for an imaginary biomedical
# manuscript. Use as a reference for what every field can hold; copy
# the structure to your own project but replace the content.
#
# Generated by `scriptorium init --example`. Pair with:
#   scriptorium validate MANUSCRIPT_STATE.yaml

meta:
  guidance_level: full       # first scriptorium project for this author

project:
  title: "Single-cell transcriptomic profiling of CD8+ T cell exhaustion in pancreatic ductal adenocarcinoma"
  target_type: manuscript
  target_venue: "Nature Cancer"
  source_format: quarto   # one of: quarto, latex, markdown, docx-via-pandoc, gdocs-export, other

document_phase:
  current: revision
  submission_target_date: "2026-09-15"   # quote dates to keep them as strings

# What this paper is arguing. Critique skills test whether the prose
# actually supports each claim; transformation skills must preserve them.
core_claims:
  - "PDAC tumor-infiltrating CD8+ T cells exhibit a distinct exhaustion trajectory characterized by early loss of effector cytokine production."
  - "TOX expression marks a transcriptionally stable exhausted state that does not revert under standard immune-checkpoint blockade in our cohort."
  - "A four-gene signature (TOX, PDCD1, HAVCR2, LAG3) predicts non-response to anti-PD-1 monotherapy with AUC=0.82 in an independent validation cohort."

# Limitations the authors already plan to acknowledge. Reviewer-simulation
# will not flag these as fatal because they're known.
known_weaknesses:
  - "Validation cohort (n=44) is underpowered for subgroup analysis by tumor stage."
  - "scRNA-seq capture rate for TILs in PDAC is low; sample sizes per patient vary widely (median 312 cells, IQR 180-490)."
  - "No functional ex vivo killing assays — exhaustion is defined transcriptionally, not functionally."

terminology:
  preferred:
    - "tumor-infiltrating lymphocytes (TILs)"
    - "pancreatic ductal adenocarcinoma (PDAC)"
    - "immune-checkpoint blockade (ICB)"
    - "exhausted CD8+ T cells"
  forbidden:
    - "killer T cells"      # informal — use cytotoxic CD8+ T cells
    - "very"                # hedging that adds no information
    - "groundbreaking"      # promotional
    - "novel"               # overused in introductions
  synonyms:
    "T-cell exhaustion": "T cell exhaustion"
    "anti-PD1": "anti-PD-1"
    "ICI": "ICB"

style:
  tone:
    - quantitative
    - restrained
    - evidence-driven
  voice: active
  audience: "translational immuno-oncology researchers; clinicians familiar with checkpoint inhibitors but not necessarily with single-cell methods"

constraints:
  preserve_citations: true
  preserve_statistics: true
  avoid_hype: true
  max_word_count: 4500    # Nature Cancer main text limit

bibliography:
  paths:
    - "references.bib"
    - "supplementary-refs.bib"
  format: bibtex

# Optional explicit section manifest for multi-file projects.
# Useful for Quarto includes or any pipeline where sections live as
# separate files. Drop this block entirely for single-file manuscripts.
sections:
  - name: "abstract"
    path: "sections/00-abstract.md"
    lead: "first-author"
    status: review
  - name: "introduction"
    path: "sections/01-introduction.md"
    lead: "first-author"
    status: final
  - name: "results"
    path: "sections/02-results.md"
    lead: "first-author"
    status: review
  - name: "discussion"
    path: "sections/03-discussion.md"
    lead: "senior-author"
    status: draft
  - name: "methods"
    path: "sections/04-methods.md"
    lead: "first-author"
    status: final
