<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Warm Parchment -->
  <rect width="1600" height="900" fill="#f3ead8" />
  
  <!-- Subtle Parchment Texture/Aging -->
  <circle cx="200" cy="150" r="300" fill="#efe0c5" opacity="0.4" filter="blur(80px)" />
  <circle cx="1400" cy="750" r="400" fill="#e8d8b8" opacity="0.3" filter="blur(100px)" />

  <!-- Main Composition Group -->
  <g transform="translate(400, 150)">
    
    <!-- Ornate Illuminated 'S' -->
    <path d="M400,100 C250,100 200,200 200,300 C200,450 400,450 400,550 C400,650 300,700 200,700" 
          fill="none" stroke="#9c3a2e" stroke-width="60" stroke-linecap="round" />
    <path d="M400,110 C270,110 230,200 230,300 C230,430 430,470 430,550 C430,630 330,670 200,670" 
          fill="none" stroke="#b8893a" stroke-width="25" stroke-linecap="round" />
    
    <!-- Medieval Flourishes / Vinework -->
    <g fill="none" stroke="#3a2a1a" stroke-width="3" stroke-linecap="round">
      <path d="M420,80 Q500,50 480,120 T550,150" />
      <circle cx="550" cy="150" r="4" fill="#9c3a2e" stroke="none" />
      <path d="M180,720 Q100,750 150,800 T250,780" />
      <path d="M150,800 Q120,850 80,820" />
      <path d="M400,450 Q500,450 550,400" />
      <path d="M550,400 L650,400 L680,370 L750,370" stroke-width="2" />
      <circle cx="750" cy="370" r="6" fill="#b8893a" stroke="none" />
      <path d="M580,400 L580,320 L620,320" stroke-width="2" />
      <rect x="620" y="315" width="10" height="10" fill="#3a2a1a" stroke="none" />
    </g>

    <!-- Marginalia Symbols (Agentic AI motifs) -->
    <g font-family="serif" font-size="24" fill="#3a2a1a" opacity="0.7">
      <text x="500" y="200">[[</text>
      <text x="520" y="200" font-style="italic" fill="#9c3a2e">intent</text>
      <text x="590" y="200">]]</text>
      <text x="100" y="400" font-family="monospace" font-weight="bold">_</text>
      <text x="500" y="600" font-family="monospace" font-size="18">{</text>
      <text x="520" y="625" font-family="monospace" font-size="18">"agent": "scribe",</text>
      <text x="520" y="650" font-family="monospace" font-size="18">"state": "gloss"</text>
      <text x="500" y="675" font-family="monospace" font-size="18">}</text>
    </g>

    <!-- Glowing Halo / AI Presence -->
    <circle cx="400" cy="400" r="250" fill="url(#aiGradient)" opacity="0.15" />
  </g>

  <!-- Title Text -->
  <text x="800" y="800" text-anchor="middle" font-family="serif" font-size="48" fill="#3a2a1a" letter-spacing="8" font-variant="small-caps">
    Scriptorium
  </text>
  <text x="800" y="840" text-anchor="middle" font-family="serif" font-size="18" fill="#3a2a1a" opacity="0.6" letter-spacing="2" font-style="italic">
    An Agentic Scriptorium for Scholarly Writing
  </text>

  <defs>
    <radialGradient id="aiGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="100%" stop-color="#4a90e2" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg>
