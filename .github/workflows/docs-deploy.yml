name: Deploy docs

on:
  push:
    branches: [main]
  # Allow manual re-deploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; cancel in-progress runs when a new push lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install quartobot
        run: uv tool install quartobot
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Preprocess (knowledge layer + root docs + Quarto render)
        working-directory: docs
        run: ./scripts/preprocess.py
      - name: Build the docs site
        working-directory: docs
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
