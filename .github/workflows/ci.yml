name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Sync dev deps
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format --check
        run: uv run ruff format --check src tests
      - name: yamllint
        run: uv run yamllint .
      - name: Install Node + markdownlint
        run: |
          npm install -g markdownlint-cli
          markdownlint \
            --config .markdownlint.yaml \
            --ignore knowledge \
            --ignore docs/node_modules \
            --ignore docs/dist \
            --ignore 'docs/src/content/docs/concepts/knowledge' \
            "**/*.md"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Sync dev deps
        run: uv sync --extra dev
      - name: pyrefly check
        # pyrefly is the primary type checker. Mypy is a secondary signal
        # and runs even if pyrefly fails so we see both reports.
        run: uv run pyrefly check src/scriptorium
        continue-on-error: false
      - name: mypy check
        if: always()
        run: uv run mypy src/scriptorium

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Sync dev deps (Python ${{ matrix.python-version }})
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --cov=scriptorium

  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Sync runtime deps
        run: uv sync
      - name: Validate examples against schema
        run: |
          for f in examples/*/MANUSCRIPT_STATE.yaml; do
            [ -f "$f" ] || continue
            echo "Validating $f"
            uv run python -c "
          import json, sys, yaml, jsonschema
          schema = json.load(open('schemas/manuscript-state.schema.json'))
          data = yaml.safe_load(open('$f'))
          jsonschema.validate(data, schema)
          print('  OK')
          "
          done

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Preprocess (knowledge layer + root docs)
        working-directory: docs
        # Skip Quarto — no .qmd files in v0.1; the preprocess script
        # already no-ops when quarto isn't installed.
        run: ./scripts/preprocess.py
      - name: Build the docs site
        working-directory: docs
        run: npm run build
