[project]
name = "agentic-scriptorium"
version = "0.1.0.dev0"
description = "An agentic scriptorium for scholarly writing — coordinated AI capabilities for manuscripts, grants, and reviews."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sean Davis", email = "seandavi@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "scholarly-writing",
    "scientific-writing",
    "manuscripts",
    "grants",
    "peer-review",
    "citation-audit",
    "editorial",
    "agentic",
    "claude-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    # Type checking: pyrefly is the primary checker (fast, Rust-based);
    # mypy stays as a secondary CI signal for edge cases pyrefly may not
    # yet handle. Cost of running both is small; coverage is wider.
    "pyrefly>=0.10",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
    "yamllint>=1.35",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/seandavi/scriptorium"
Documentation = "https://github.com/seandavi/scriptorium#readme"
Issues = "https://github.com/seandavi/scriptorium/issues"
Source = "https://github.com/seandavi/scriptorium"

[project.scripts]
scriptorium = "scriptorium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptorium"]
# Ship the JSON Schema, plugin manifest, starter template, and skills as
# package data so the CLI can locate them via `importlib.resources`.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "scriptorium/_schemas"
".claude-plugin" = "scriptorium/_claude_plugin"
"templates" = "scriptorium/_templates"
"skills" = "scriptorium/_skills"

[tool.hatch.build.targets.sdist]
include = [
    "src/scriptorium/**",
    "skills/**",
    "schemas/**",
    "templates/**",
    "examples/**",
    ".claude-plugin/**",
    "tests/**",
    "README.md",
    "DESIGN.md",
    "INSTALL.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["site", "docs", "examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.mypy]
files = ["src/scriptorium"]
python_version = "3.10"
strict = true
warn_unreachable = true

[tool.pyrefly]
project_includes = ["src/scriptorium"]
python_version = "3.10"
