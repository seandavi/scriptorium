# scriptorium skill manifest

name: argumentative-flow
version: 0.1.0
category: transformation     # critique | validation | normalization | transformation | generation

description: >
  Improve a manuscript section's logical and argumentative coherence
  while preserving every citation, statistic, and declared terminology
  choice. Produces a structural diagnosis, a proposed outline, the
  revised text with a diff against the source, and a preservation
  report.

# This is the v0.1 TRANSFORMATIVE skill — it modifies prose. Sets the
# pattern for conservative-edit posture all future transformation
# skills inherit.
produces:
  - structured-markdown-report
  - revised-prose
  - diff-against-source

modifies:
  # Single named section at a time. A whole-manuscript pass is outside
  # the default scope (scope guard single-section-unit).
  - manuscript_section

# document_phase values the skill is designed to operate on. The
# transformation is per-section and reviewable; insufficient declared
# prose at outline phase.
# Consumed by docs build (reference/skills page generator).
lifecycle_phases:
  - draft
  - review
  - revision

# How this skill frames its output at each meta.guidance_level value.
# Sourced from the conversational-style section of SKILL.md so the
# concept page (concepts/guidance-level.md) renders from manifest.
# Consumed by docs build (concepts/guidance-level page generator).
guidance_level_behavior:
  terse: >
    Open with one line ("running argumentative-flow on <section>");
    emit the markdown report; no closing summary.
  standard: >
    Open with the section's role in the manuscript and what the
    structural diagnosis will check; close with a one-line summary
    of the most material structural issue found.
  full: >
    Open with what reader-expectation theory predicts about how the
    section should be organised (topic position to subject to stress
    position) and what narrative frameworks add; close with which
    proposed changes are about logic vs. about flow. The ESL-aware
    hedging preservation is surfaced in the preservation report.

# Explicit invocation is hard-coded into the prompt. This skill must
# NEVER auto-invoke or be invoked as a follow-up to another skill's
# output without the user re-asking. The author owns their voice;
# unrequested rewrites — even "helpful" ones — are unwelcome.
invocation: explicit-only

# Hard preservation constraints. Violating any of these is a contract
# breach, not a judgment call.
preservation_constraints:
  - citations         # every cite key in source present in output
  - quantitative      # numbers, units, p-values, CIs preserved verbatim
  - terminology       # MANUSCRIPT_STATE.terminology honored
  - voice             # active/passive matches source
  - tone              # style.tone targets respected
  - claim_set         # no added/removed/weakened claims
  - hedging           # epistemic modals, adverbs, approximators,
                      # attributive verbs, indirect attributions —
                      # Swales/Hyland stance markers preserved unless
                      # a logical-coherence reason justifies the change

platforms:
  claude-code:
    skill_file: SKILL.md
  platform-neutral:
    prompt_file: prompt.md

inputs:
  - name: section_text
    required: true
    description: A single named section (introduction, discussion, etc.) or subsection.
  - name: manuscript_state
    required: true
    description: MANUSCRIPT_STATE.yaml from the project root.
    schema: manuscript-state.schema.json
  - name: bibliography
    required: true
    description: Bibliography entries for cite keys appearing in the section.

# Knowledge-layer documents that ground this skill's design decisions.
grounding:
  - knowledge/scientific-writing/reader-expectation-approach.md
  - knowledge/scientific-writing/narrative-frameworks.md
  - knowledge/critique-techniques/argument-mapping.md
  - knowledge/editing/semantic-preservation.md
  - knowledge/editing/revision-research.md
  - knowledge/scientific-writing/esl-writers-swales-hyland.md
  - knowledge/citations/hallucination-in-llm-citations.md

non_goals:
  - Adding or removing citations.
  - Changing numbers or quantitative statements.
  - Substituting terminology not licensed by the state file.
  - Adding stylistic embellishment.
  - Rewriting the technical content of a methods section (flow work on its structure is in scope).
  - Compressing length (different skill; v0.2 candidate).
  - Smoothing out ESL hedging or stance patterns.
  - Transforming an entire manuscript at once by default (scope guard single-section-unit).
  - Auto-invocation as a follow-up to another skill.

# Guards this skill applies (knowledge/conventions/author-authority.md).
# Policy and scope guards are defaults the author can override, per run
# or under MANUSCRIPT_STATE.yaml#meta.overrides; accuracy guards are fixed.
guards:
  - id: single-section-unit
    kind: scope
    summary: "This skill transforms one section per run so every change stays reviewable; a whole-manuscript pass is outside its default scope."
    default: refuse
  - id: no-parametric-citations
    kind: accuracy
    summary: "Citations never come from model memory: only works in the manuscript's bibliography, or ones verified against an authoritative record in this session, are named."
    source: "knowledge/citations/hallucination-in-llm-citations.md"
    default: refuse
  - id: no-false-verification-claims
    kind: accuracy
    summary: "The skill never reports a check as done or passed when it was not (full-text support, a clean preservation report, a figure it did not see)."
    default: refuse
  - id: preserve-cited-support
    kind: accuracy
    summary: "Every cite key in the source stays attached to the claim it supports; none is removed, renamed or detached by the transformation."
    source: "knowledge/editing/semantic-preservation.md"
    default: refuse
  - id: preserve-quantities-verbatim
    kind: accuracy
    summary: "Numbers, units and statistics are carried over verbatim; none is rounded, re-expressed or replaced with words."
    source: "knowledge/editing/semantic-preservation.md"
    default: refuse
  - id: preserve-claim-set
    kind: accuracy
    summary: "The transformation adds, removes, merges, re-scopes or re-weights no claim (including by changing a hedge) without recording the change and its reason."
    source: "knowledge/editing/semantic-preservation.md"
    default: refuse
