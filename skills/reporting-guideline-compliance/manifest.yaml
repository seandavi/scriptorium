# scriptorium skill manifest
# This file declares the skill's metadata, supported platforms,
# tool requirements, and knowledge-layer grounding. It is consumed
# by the scriptorium CLI (`list`, `prompt-pack`) and by future
# orchestrators that compose skills.

name: reporting-guideline-compliance
version: 0.1.0
category: validation        # critique | validation | normalization | transformation | generation | meta

description: >
  Run an EQUATOR Network reporting-guideline checklist (CONSORT,
  SPIRIT, STROBE, PRISMA, ARRIVE, STARD, TRIPOD/TRIPOD+AI, CARE,
  COREQ, CHEERS, plus AI extensions) against a manuscript. Classifies
  each checklist item as present / partial / missing /
  not-applicable, with a quoted manuscript excerpt as the anchor
  or an explicit gap statement. Downstream of v0.2's
  reporting-guideline-fit (which infers which checklist applies).
  Validation skill — surfaces gaps for the author to address;
  does not modify the manuscript, by default does not draft prose
  (an author-overridable scope guard), and never invents facts
  about the study.

# Validation skills emit structured findings; they do not modify
# the manuscript and, by default, do not propose replacement prose.
produces:
  - structured-markdown-report

modifies: []

# document_phase values the skill is designed to operate on. Declines
# outline-phase manuscripts by default (outline-phase scope guard).
# Consumed by docs build (reference/skills page generator).
lifecycle_phases:
  - review
  - revision
  - submission

# How this skill frames its output at each meta.guidance_level value.
# Sourced from the conversational-style section of SKILL.md so the
# concept page (concepts/guidance-level.md) renders from manifest.
# Consumed by docs build (concepts/guidance-level page generator).
guidance_level_behavior:
  terse: >
    Open with one line ("running reporting-guideline-compliance
    against <checklist> <version>"); emit the markdown report; no
    closing summary.
  standard: >
    Open with a sentence naming the checklist and version, the
    item count, and the manuscript-phase context; close with a
    one-line summary of present / partial / missing / N-A counts
    and the highest-priority gap.
  full: >
    Open with what reporting guidelines do (minimum-information
    standards so reviewers and readers can evaluate methodology
    consistently — the EQUATOR Network registry, whose library
    lists roughly 700 records), what this audit produces
    (per-item present / partial / missing / N-A with a quoted
    anchor or explicit gap), and how to read it (act on missing first, then partial;
    N/A is not a gap; by default the audit does not draft prose
    to fill gaps).

# Explicit invocation. Invoked when the applicable checklist is
# known (declared in state, passed from reporting-guideline-fit,
# or named in the invocation) and the manuscript is in draft,
# revision, or submission phase.
invocation: explicit

# Platforms this skill ships for.
platforms:
  claude-code:
    skill_file: SKILL.md
  platform-neutral:
    prompt_file: prompt.md

# Inputs the skill needs to do its job.
inputs:
  - name: manuscript_text
    required: true
    description: >
      Full manuscript prose. File path(s) or pasted text. For
      multi-file projects, every file declared under `sections`
      or `supplements` is read. Title, abstract, methods,
      results, discussion, and any flow diagram are load-bearing
      for an EQUATOR-checklist audit.
  - name: manuscript_state
    required: true
    description: >
      MANUSCRIPT_STATE.yaml from the project root. Required:
      document_phase.current (declines on outline by default).
      Optional: meta.overrides (guards the author has
      overridden), project.target_venue (venue-specific layered requirements),
      core_claims (intent disambiguation), known_weaknesses
      (acknowledged-but-unaddressed cross-reference),
      meta.guidance_level (framing only).
    schema: manuscript-state.schema.json
  - name: reporting_guideline_fit_output
    required: false
    description: >
      Output payload from a prior reporting-guideline-fit run.
      When present, the high-confidence inferred guideline(s)
      drive the audit. Alternative inputs: an explicit checklist
      named in the invocation, or (when the schema carries it)
      MANUSCRIPT_STATE.yaml#reporting_guideline. If none of
      these is present, the skill declines by default
      (checklist-required guard) and points the author at
      reporting-guideline-fit.

# Knowledge-layer documents that ground this skill's design.
grounding:
  - knowledge/conventions/guidance-level.md
  - knowledge/conventions/declared-work-scope.md
  - knowledge/conventions/author-authority.md
  - knowledge/scientific-writing/reporting-guidelines.md
  - knowledge/critique-techniques/internal-consistency.md

# Guards this skill applies, per knowledge/conventions/author-authority.md.
# Scope guards are defaults the author can override (per run or under
# meta.overrides); accuracy guards are fixed.
guards:
  - id: generation-from-blankness
    kind: scope
    summary: "Nothing declared to ground against: this would write content (a section, a missing item, a caption) the author has not written or declared."
    source: "knowledge/conventions/declared-work-scope.md"
    default: refuse
  - id: outline-phase
    kind: scope
    summary: "The manuscript is at outline phase; there is not yet enough declared prose for this skill to work on."
    source: "knowledge/conventions/declared-work-scope.md"
    default: refuse
  - id: checklist-required
    kind: scope
    summary: "No reporting checklist is declared, supplied or named; this skill audits a given checklist and does not infer one (reporting-guideline-fit does)."
    source: "knowledge/conventions/declared-work-scope.md"
    default: refuse
  - id: no-false-verification-claims
    kind: accuracy
    summary: "The skill never reports a check as done or passed when it was not (full-text support, a clean preservation report, a figure it did not see)."
    default: refuse
  - id: no-invented-manuscript-facts
    kind: accuracy
    summary: "The skill never states facts about the author's work (figure content, who did what, what the study did) that the manuscript and declared state do not contain."
    source: "knowledge/conventions/declared-work-scope.md"
    default: refuse

# Hard rules the skill must honor.
preservation_constraints:
  - never_invent_prose             # surface gaps; fill-text only as a bracketed placeholder under override
  - never_modify_manuscript        # validation skill, no transformation
  - refuse_on_outline_phase        # default; outline-phase guard is overridable
  - refuse_when_checklist_unknown  # default; checklist-required guard is overridable
  - walk_every_checklist_item      # coverage is the point
  - anchor_present_and_partial     # quoted excerpt required
  - flow_diagram_items_default_partial  # author verifies the diagram
  - prefer_current_versions        # CONSORT 2025 over 2010; PRISMA 2020 over 2009; TRIPOD+AI 2024 over TRIPOD 2015
  - version_tag_every_item_number  # item numbers shift between versions
  - never_write_to_manuscript_state

# What this skill explicitly is NOT.
non_goals:
  - Inferring which EQUATOR checklist applies, by default. That
    is the v0.2 reporting-guideline-fit skill's job; this skill
    audits the checklist it is given (checklist-required guard,
    author-overridable).
  - Drafting prose to fill missing items, by default. Validation
    skill — the author owns the fix (generation-from-blankness
    guard, author-overridable). Never invents facts about the
    study.
  - Modifying the manuscript. No transformation.
  - Critiquing study design. The audit assesses what is
    reported, not whether the design was the right choice.
  - Auditing quantitative internal consistency (Table 1 N vs.
    methods N; abstract percentages vs. figure percentages).
    Planned statistics-consistency skill.
  - Auditing figure / text alignment. See the
    figure-text-alignment skill.
  - Auditing citation accuracy. citation-audit's job.
  - Operating on outline-phase manuscripts, by default
    (outline-phase guard, author-overridable).
  - Forcing a confident present / missing on ambiguous
    items. `partial` and `not-applicable` are first-class
    outcomes.
  - Auditing against a superseded checklist version when a
    current version applies (CONSORT 2010 when 2025 is current,
    unless the author or venue requires 2010; PRISMA 2009 when
    2020 is current; TRIPOD 2015 when TRIPOD+AI 2024 is current
    for AI-based prediction models).
  - Editor-side enforcement. Author-side decision support.
