# scriptorium skill manifest
# This file declares the skill's metadata, supported platforms,
# tool requirements, and knowledge-layer grounding.

name: author-contribution-audit
version: 0.3.0
category: critique          # critique | validation | normalization | transformation | generation | meta

description: >
  Audit the manuscript's Author Contributions section against
  ICMJE's four authorship criteria and CRediT's 14 contributor
  roles. Per-author analysis, journal-specific variant check
  when target_venue is set, LLM-as-author check and ICMJE
  AI-disclosure placement check.
  Soft recommendations; never auto-writes the section, never
  duplicates authorship data in MANUSCRIPT_STATE.yaml. By
  default does not adjudicate authorship disputes; the author
  can override that and its other policy and scope guards.

# Author-side decision support. Critique-shaped — produces a
# structured report; modifies no manuscript content.
produces:
  - structured-markdown-report

modifies: []

# document_phase values the skill is designed to operate on. Declines
# outline-phase manuscripts by default (guard outline-phase).
# Consumed by docs build (reference/skills page generator).
lifecycle_phases:
  - review
  - revision
  - submission

# How this skill frames its output at each meta.guidance_level value.
# Sourced from the conversational-style section of SKILL.md so the
# concept page (concepts/guidance-level.md) renders from manifest.
# Consumed by docs build (concepts/guidance-level page generator).
guidance_level_behavior:
  terse: >
    Open with one line ("running author-contribution audit"); emit
    the markdown report; no closing summary.
  standard: >
    Open with one sentence naming the state (present / absent /
    sketchy) and the number of listed authors; close with a
    one-line summary of the most material finding.
  full: >
    Open with what the audit does (ICMJE four criteria + CRediT 14
    roles + journal-specific variants when target_venue is set) and
    why it matters (Wislar et al. 2011 BMJ — 21% of papers at top
    medical journals had honorary or ghost authorship; the CRediT
    taxonomy is the field's structural response). The structured
    output is unchanged across levels.

# Explicit invocation only. The skill is invoked when the author
# asks for a contributions check, is preparing for submission, or
# wants to verify the section meets a venue's requirements.
invocation: explicit

# Platforms this skill ships for.
platforms:
  claude-code:
    skill_file: SKILL.md
  platform-neutral:
    prompt_file: prompt.md

# Inputs the skill needs to do its job.
inputs:
  - name: manuscript_state
    required: true
    description: >
      MANUSCRIPT_STATE.yaml. Required: document_phase.current
      (declines on outline by default); project.target_type
      (signals field convention for author-order norms). Optional:
      project.target_venue (journal-specific variant check);
      terminology.preferred; meta.overrides (author overrides of
      the guards below).
    schema: manuscript-state.schema.json
  - name: manuscript_byline
    required: true
    description: >
      The author list with affiliations. The skill needs to know
      who is expected to have contributions documented.
  - name: author_contributions_section
    required: false
    description: >
      The Author Contributions section from the manuscript, if it
      exists. Absence is itself a finding the skill flags.
  - name: acknowledgements_section
    required: false
    description: >
      Optional. Used for ghost-authorship signal detection
      (acknowledgement-listed contributors whose declared work
      would meet ICMJE criteria).
  - name: who_did_what
    required: false
    description: >
      Optional author-supplied who-did-what list when the
      contributions section is absent or sketchy. The skill maps
      to CRediT roles as a draft for the author to refine;
      never fabricates a mapping without input.

# Knowledge-layer documents that ground this skill's design.
grounding:
  - knowledge/conventions/guidance-level.md
  - knowledge/conventions/declared-work-scope.md
  - knowledge/peer-review/credit-taxonomy-authorship.md
  - knowledge/conventions/author-authority.md

# Guards the skill applies, per knowledge/conventions/author-authority.md.
# Policy and scope guards are author-overridable defaults; accuracy
# guards are fixed.
guards:
  - id: editorial-side-use
    kind: policy
    summary: "Running this as a reviewer or editor of a submitted manuscript uploads a confidential manuscript and hands judgement to AI, which reviewer AI policies restrict (NIH prohibits it outright for NIH peer review)."
    source: "NIH NOT-OD-23-149; Elsevier \"Generative AI policies for journals\" (June 2026); Springer Nature \"AI Use in Peer Review\"; ICMJE Recommendations Section V (January 2026)"
    default: ask
  - id: llm-authorship
    kind: policy
    summary: "ICMJE says AI tools cannot be authors because they cannot be accountable for the work; listing one breaches ICMJE and aligned journal policies."
    source: "ICMJE Recommendations (May 2023 AI authorship update; Section V, January 2026)"
    default: refuse
  - id: outline-phase
    kind: scope
    summary: "The manuscript is at outline phase; there is not yet enough declared prose for this skill to work on."
    source: "knowledge/conventions/declared-work-scope.md"
    default: refuse
  - id: authorship-dispute-adjudication
    kind: scope
    summary: "Whether someone should be added or removed as an author is the author team's decision; by default the skill reports ICMJE gaps only."
    default: refuse
  - id: no-invented-manuscript-facts
    kind: accuracy
    summary: "The skill never states facts about the author's work (figure content, who did what, what the study did) that the manuscript and declared state do not contain."
    source: "knowledge/conventions/declared-work-scope.md"
    default: refuse

# Hard rules the skill must honor. Dispute adjudication, LLM authors
# and outline phase are author-overridable guards (see guards: above).
preservation_constraints:
  - never_auto_write_contributions_section
  - never_fabricate_credit_mappings
  - per_author_anchored_findings  # never global "section is weak"

# What this skill explicitly is NOT.
non_goals:
  - Adjudicating authorship disputes, by default. ICMJE
    criteria are the framework; whether to add or remove an
    author is the author team's decision.
  - Auto-writing the Author Contributions section. Soft
    recommendations only.
  - Fabricating CRediT mappings. Without author input, the
    skill asks rather than guesses.
  - Duplicating authorship data in MANUSCRIPT_STATE.yaml. The
    schema does not carry a `contributors:` field — declared
    prose lives in the manuscript.
  - Recommending or keeping LLMs / chatbots / AI tools as
    authors, by default. Per ICMJE 2023 and aligned policies at
    Nature, Science, JAMA, Cell Press journals. The finding is
    always reported.
  - Operating on outline-phase manuscripts, by default.
  - Editorial-side use without asking. This is author-side
    decision support; a reviewer or editor of a submitted
    manuscript is asked before the skill proceeds.
  - Verifying contribution accuracy. The skill audits how
    contributions are documented, not whether they're truthful
    — the author team owns ground truth.
