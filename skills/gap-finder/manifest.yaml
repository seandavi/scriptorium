# scriptorium skill manifest
# This file declares the skill's metadata, supported platforms,
# tool requirements, and knowledge-layer grounding.

name: gap-finder
version: 0.3.0
category: critique          # critique | validation | normalization | transformation | generation | meta

description: >
  Identify gaps in existing draft prose (claims under-supported,
  premises missing, related work not engaged with, counterarguments
  not addressed, internal-consistency mismatches across sections)
  and suggest directions for filling them. Structured by a seven-
  category gap taxonomy. Each finding anchors in a specific
  manuscript passage. Suggested directions are pasteable search
  strategies; never invented citations. Declines outline-phase
  manuscripts and pre-declaration questions by default; the author
  can override.

# Read-only relative to the user's project. Critique-shape: produces
# a structured report; does not modify the manuscript; by default
# does not generate prose to fill any gap.
produces:
  - structured-markdown-report

modifies: []

# document_phase values the skill is designed to operate on. Declines
# outline-phase manuscripts (and pre-declaration questions) by default
# (guards outline-phase, pre-declaration-ideation).
# Consumed by docs build (reference/skills page generator).
lifecycle_phases:
  - draft
  - review
  - revision

# How this skill frames its output at each meta.guidance_level value.
# Sourced from the conversational-style section of SKILL.md so the
# concept page (concepts/guidance-level.md) renders from manifest.
# Consumed by docs build (concepts/guidance-level page generator).
guidance_level_behavior:
  terse: >
    Open with one line ("running gap analysis"); emit the markdown
    report; no closing summary. Surfaces the top three to five
    anchored gaps.
  standard: >
    Open with a sentence naming the focus question and the gap
    categories that will be checked; close with which category
    had the most findings and whether any are load-bearing. The
    full anchored list.
  full: >
    Open with what gap-finder is doing (structured taxonomy of
    seven gap categories: literature, evidence, methodological,
    population, translation, counterargument,
    internal-consistency) and why this matters (the seven
    categories suggest different remediation strategies). Adds
    per-gap search strategies the author can run.

# Explicit invocation. The skill is invoked when the author asks
# "what's missing here?" with a manuscript section in mind. Not a
# side-effect of any other skill.
invocation: explicit

# Platforms this skill ships for.
platforms:
  claude-code:
    skill_file: SKILL.md
  platform-neutral:
    prompt_file: prompt.md

# Inputs the skill needs to do its job.
inputs:
  - name: manuscript_state
    required: true
    description: >
      MANUSCRIPT_STATE.yaml from the project root. Required:
      document_phase.current (declines outline by default), core_claims
      (anchors what's being argued), known_weaknesses (gaps already
      named, not re-flagged). Optional: style.audience,
      project.target_venue / candidate_venues, terminology.preferred.
    schema: manuscript-state.schema.json
  - name: manuscript_text
    required: true
    description: >
      The section the author asked about (or the full prose if
      cross-section internal-consistency gaps are in scope). The
      section must have prose to anchor findings in; a stub is
      sufficient but an empty section is not.
  - name: focus_question
    required: true
    description: >
      The question being answered. "What's missing in the
      discussion?", "What related work haven't we engaged with?",
      "What counterarguments to claim X aren't addressed?" If
      not supplied at invocation, the skill asks for one before
      scanning rather than producing exhaustive output.

# Knowledge-layer documents that ground this skill's design.
grounding:
  - knowledge/conventions/guidance-level.md
  - knowledge/conventions/declared-work-scope.md
  - knowledge/critique-techniques/research-gap-detection.md
  - knowledge/scientific-writing/literature-search-strategies.md
  - knowledge/critique-techniques/argument-mapping.md
  - knowledge/critique-techniques/logical-fallacy-detection.md
  - knowledge/critique-techniques/internal-consistency.md
  - knowledge/peer-review/common-critiques-taxonomy.md
  - knowledge/citations/hallucination-in-llm-citations.md
  - knowledge/conventions/author-authority.md

# Rules the skill honours. The refuse_* and never_draft_* entries are
# defaults the author can override (see guards: below); the others
# are fixed.
preservation_constraints:
  - never_invent_citations               # suggested directions are searches, not cites
  - every_finding_anchors_in_declared_prose
  - refuse_on_outline_phase
  - refuse_on_pre_declaration_questions
  - never_draft_prose_to_fill_gaps
  - never_produce_critique_shaped_findings  # that's reviewer-simulation's job

# What this skill explicitly is NOT.
non_goals:
  - Drafting prose to fill any gap. Suggests directions only, by
    default.
  - Inventing specific citations. "Suggested directions" output
    is search strategies; by default it never says `cite this
    paper`.
  - Operating on outline-phase manuscripts. Declines by default.
  - Operating on pre-declaration questions ("what should I write
    about?"). Author owns the proposer step; declines by default.
  - Producing exhaustive output. Asks for a focus question if
    one isn't supplied.
  - Acting as a reviewer simulation. Reviewer-simulation is
    adversarial; gap-finder is collaborative. Findings frame as
    opportunities to strengthen, not deficiencies to defend.
  - Editorial-side use. Author-side decision support only.
  - Auto-invoking other skills. Suggests next steps;
    never invokes.

# Guards this skill applies, per knowledge/conventions/author-authority.md.
# Policy and scope guards are defaults the author can override (a per-run
# answer, or meta.overrides in MANUSCRIPT_STATE.yaml); accuracy guards are
# fixed.
guards:
  - id: generation-from-blankness
    kind: scope
    summary: "Nothing declared to ground against: this would write content (a section, a missing item, a caption) the author has not written or declared."
    source: "knowledge/conventions/declared-work-scope.md"
    default: refuse
  - id: pre-declaration-ideation
    kind: scope
    summary: "Choosing what to study or what a section should argue is the author's proposer step, which comes before scriptorium's declared-work scope."
    source: "knowledge/conventions/declared-work-scope.md"
    default: refuse
  - id: outline-phase
    kind: scope
    summary: "The manuscript is at outline phase; there is not yet enough declared prose for this skill to work on."
    source: "knowledge/conventions/declared-work-scope.md"
    default: refuse
  - id: citation-recommendations
    kind: scope
    summary: "Choosing what to cite is the author's call; by default the skill names searches, not papers. If overridden, it names only works it resolved against Crossref or PubMed in this session."
    source: "knowledge/conventions/declared-work-scope.md"
    default: refuse
  - id: no-parametric-citations
    kind: accuracy
    summary: "Citations never come from model memory: only works in the manuscript's bibliography, or ones verified against an authoritative record in this session, are named."
    source: "knowledge/citations/hallucination-in-llm-citations.md"
    default: refuse
