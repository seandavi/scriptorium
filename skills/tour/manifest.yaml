# scriptorium skill manifest
# This file declares the skill's metadata, supported platforms,
# tool requirements, and knowledge-layer grounding.

name: tour
version: 0.1.0
category: meta              # critique | validation | normalization | transformation | generation | meta

description: >
  Conversational onboarding for new users. Three or four turns:
  greets, asks what the user is working on, walks through the
  relevant subset of scriptorium, shows an example
  MANUSCRIPT_STATE.yaml, ends with one concrete next move.
  Strictly read-only; never auto-invokes another skill.

# Read-only relative to the user's project.
produces:
  - markdown-conversation

modifies: []

# document_phase values the skill is designed to operate on. tour
# is meta and operates at any phase (including before init has run).
# Consumed by docs build (reference/skills page generator).
lifecycle_phases:
  - outline
  - draft
  - review
  - revision
  - submission

# How this skill frames its output at each meta.guidance_level value.
# tour always runs at `full` regardless of the saved preference
# because the skill IS orientation; truncating it defeats the
# point. Detection of a returning user is the right knob, not
# guidance level. The descriptions below explain the constant
# behaviour.
# Consumed by docs build (concepts/guidance-level page generator).
guidance_level_behavior:
  terse: >
    tour ignores the saved level and always runs at full;
    truncating an onboarding tour defeats its purpose. A returning
    user is detected from MANUSCRIPT_STATE.yaml presence and tour
    skips to the relevant subset rather than truncating prose.
  standard: >
    Same as terse — tour always runs at full regardless of the
    saved level. The level still gets mentioned to the user as
    one of the things scriptorium will ask about during init.
  full: >
    tour's native level. Three or four turns: greet, ask what the
    user is working on, walk through the relevant subset of
    scriptorium, show an example MANUSCRIPT_STATE.yaml, end with
    one concrete next move (usually scriptorium:init).

# Explicit invocation. The intended pattern is that a maintainer
# points a new user at `/scriptorium:tour` as their first step,
# rather than linking them to documentation.
invocation: explicit

# Platforms this skill ships for.
platforms:
  claude-code:
    skill_file: SKILL.md
  platform-neutral:
    prompt_file: prompt.md

# Inputs the skill needs to do its job.
inputs:
  - name: cwd
    required: true
    description: >
      The user's current working directory, so the skill can detect
      whether MANUSCRIPT_STATE.yaml already exists (returning user)
      and what kind of project it represents.
  - name: plugin_tree
    required: false
    description: >
      The scriptorium plugin tree (skills/, schemas/, knowledge/,
      templates/). Used to show a concrete MANUSCRIPT_STATE.yaml
      excerpt; the skill can fall back to a synthesised excerpt if
      unavailable.

# Knowledge-layer documents that ground this skill's design decisions.
grounding:
  - knowledge/conventions/guidance-level.md
  - knowledge/README.md

# What this skill explicitly is NOT.
non_goals:
  - Writing MANUSCRIPT_STATE.yaml or any other file.
  - Auto-invoking init / citation-audit / reviewer-simulation /
    argumentative-flow / explain at the end of the conversation.
  - Reading manuscript prose, bibliography, or any file other than
    MANUSCRIPT_STATE.yaml (for situation detection only).
  - Replacing INSTALL.md or DESIGN.md as reference documentation.
  - Listing every skill at equal weight; tour picks the loop the
    stated user context needs.
